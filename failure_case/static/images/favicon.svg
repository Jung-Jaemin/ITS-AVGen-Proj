<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>
  <!-- Audio waveform bars -->
  <rect x="10" y="28" width="4" height="8"  rx="2" fill="white" opacity="0.9"/>
  <rect x="17" y="22" width="4" height="20" rx="2" fill="white" opacity="0.9"/>
  <rect x="24" y="18" width="4" height="28" rx="2" fill="white" opacity="0.9"/>
  <rect x="31" y="24" width="4" height="16" rx="2" fill="white" opacity="0.9"/>
  <!-- Play triangle -->
  <polygon points="42,24 42,40 56,32" fill="white" opacity="0.9"/>
</svg>
